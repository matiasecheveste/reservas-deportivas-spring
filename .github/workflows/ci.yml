# Reservas deportivas — Matías Nicolás Echeveste Cardozo
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informes-surefire
          path: target/surefire-reports/

  postgres:
    # Las mismas pruebas, contra PostgreSQL real con las migraciones de Flyway.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reservas
          POSTGRES_USER: reservas
          POSTGRES_PASSWORD: reservas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reservas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/reservas
      SPRING_DATASOURCE_USERNAME: reservas
      SPRING_DATASOURCE_PASSWORD: reservas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -ntp verify

  docker:
    runs-on: ubuntu-latest
    needs: h2
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reservas-deportivas .
